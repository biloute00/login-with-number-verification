# Upsun configuration for the Number Verification login demo (app/main.py, FastAPI)
applications:
  app:
    type: "python:3.12"
    build:
      flavor: none
    hooks:
      build: |
        set -ex
        pip install -r app/requirements.txt
    web:
      upstream:
        socket_family: tcp
      commands:
        start: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
      locations:
        /:
          passthru: true

routes:
  https://{default}/:
    type: upstream
    upstream: app:http
